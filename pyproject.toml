[project]
name = "lcp"
version = "0.5.0"
description = "LCP — self-hosted LLM gateway: route, enforce tool permissions, track costs, manage API keys"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[project.scripts]
lcp = "src.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not integration\""
markers = [
    "integration: tests that require a running server",
]
