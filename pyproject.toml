[project]
name = "lcp"
version = "0.5.0"
description = "LCP — self-hosted LLM gateway: route, enforce tool permissions, track costs, manage API keys"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "aunttwister" }]
dependencies = [
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/aunttwister/lcp"
Repository = "https://github.com/aunttwister/lcp"
Issues = "https://github.com/aunttwister/lcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]
bench = [
    "datasets>=3.0",
]

[project.scripts]
lcp = "src.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not integration\""
markers = [
    "integration: tests that require a running server",
]
