services:
  smallm-gw-dev:
    build: .
    container_name: smallm-gw-dev
    restart: unless-stopped
    ports:
      - "8735:8734"
    volumes:
      - smallm_gw_data:/app/data
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734

volumes:
  smallm_gw_data:
