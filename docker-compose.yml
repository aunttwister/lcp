services:
  lcp:
    build:
      context: .
      args:
        WITH_ROUTER: ${WITH_ROUTER:-1}
        WITH_MEMORY: ${WITH_MEMORY:-0}
        WITH_BENCH: ${WITH_BENCH:-0}
    container_name: lcp
    restart: unless-stopped
    ports:
      - "8734:8734"
    volumes:
      - /your/data/app/lcp/data:/app/data
      - /your/data/app/lcp/modules:/opt/lcp-modules
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken_cache
      - LCP_SECRET_KEY=${LCP_SECRET_KEY}
      # Runtime-installed modules (e.g. LiveBench) persist in a dedicated
      # bind-mount directory so they survive container recreation.
      - LCP_MODULES_DIR=/opt/lcp-modules
      # Make module dependencies importable IN-PROCESS. ONLY the memory module
      # needs to be on the main process's import path (lancedb + sentence-
      # transformers for the memory plugin). LiveBench's deps (site) and
      # package (livebench) are imported ONLY by benchmark SUBPROCESSES, which
      # set their own PYTHONPATH via livebench_pythonpath() — putting them on
      # the main path would let LiveBench's tokenizers/transformers shadow the
      # globally-baked semantic-routing deps (the exact failure we hit).
      # Semantic-routing deps are baked into the image GLOBALLY (WITH_ROUTER=1).
      - PYTHONPATH=/opt/lcp-modules/memory
      # Provider API keys and the OpenCode cookie are managed via the dashboard
      # UI — they're encrypted with LCP_SECRET_KEY and stored in SQLite.
