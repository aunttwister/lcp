services:
  lcp-dev:
    build: .
    container_name: lcp-dev
    restart: unless-stopped
    ports:
      - "8735:8734"
    volumes:
      - lcp_data:/app/data
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734

volumes:
  lcp_data:
