services:
  lcp:
    build: .
    container_name: lcp
    restart: unless-stopped
    ports:
      - "8734:8734"
    volumes:
      - llm-cost-tracker_cost_data:/app/data
      - ./config/gateway.yaml:/app/config/gateway.yaml
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken_cache
      - LCP_SECRET_KEY=${LCP_SECRET_KEY}
      # Provider API keys and the OpenCode cookie are managed via the dashboard
      # UI — they're encrypted with LCP_SECRET_KEY and stored in SQLite.

volumes:
  llm-cost-tracker_cost_data:
    external: true
