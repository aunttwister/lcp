services:
  lcp:
    build:
      context: .
      args:
        WITH_ROUTER: ${WITH_ROUTER:-0}
        WITH_MEMORY: ${WITH_MEMORY:-0}
        WITH_BENCH: ${WITH_BENCH:-0}
    container_name: lcp
    restart: unless-stopped
    ports:
      - "8734:8734"
    volumes:
      # Host paths live in host-paths.env (gitignored) — this repo is public, so
      # the estate's layout must not be named in a tracked file (ADMIN_ACTIONS
      # #19). Required rather than defaulted, so a missing value fails loudly at
      # `compose config` instead of silently mounting an empty directory.
      - ${LCP_HOST_DATA_DIR:?set LCP_HOST_DATA_DIR in host-paths.env}:/app/data
      - ${LCP_HOST_MODULES_DIR:?set LCP_HOST_MODULES_DIR in host-paths.env}:/opt/lcp-modules
      # Work layer: board ledger, task tree, session transcripts. READ-ONLY —
      # a dashboard must never change what the board published, move a task, or
      # rewrite what the agents did; read-only is enforced at the mount level.
      - ${LCP_HOST_DECISIONS_DB:?set LCP_HOST_DECISIONS_DB in host-paths.env}:/app/work/decisions.db:ro
      - ${LCP_HOST_WORK_TREE:?set LCP_HOST_WORK_TREE in host-paths.env}:/app/work-tree:ro
      - ${LCP_HOST_PROFILES_DIR:?set LCP_HOST_PROFILES_DIR in host-paths.env}:/app/profiles:ro
      # M2c: the L2 profile's skills/ is a symlink to this shared directory, so
      # the target has to be mounted at its own absolute path or the link dangles
      # inside the container and the Skills tab reports "no skills directory".
      # Staging-proven; prod cutover needed it (ADMIN_ACTIONS #13).
      - ${LCP_HOST_SHARED_SKILLS:?set LCP_HOST_SHARED_SKILLS in host-paths.env}:/root/hermes-work/shared-skills:ro
      # Cron op spool — the ONLY deliberately-writable mount in the work layer:
      # the Cron page writes validated intents here and the host-side executor
      # applies them via the Hermes CLI (see work-layers-cron-executor.timer).
      - ${LCP_HOST_CRON_OPS_DIR:?set LCP_HOST_CRON_OPS_DIR in host-paths.env}:/app/cron-ops:rw
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken_cache
      # LCP_SECRET_KEY is deliberately NOT repeated here. `env_file: .env` above
      # already injects it, and `environment:` overrides `env_file` — so an
      # interpolation of it (${LCP_SECRET_KEY}) becomes an EMPTY value as soon as
      # compose runs with --env-file, which would make every stored credential
      # undecryptable. env_file is the single source for secrets.
      - LCP_WORK_DECISIONS_DB=/app/work/decisions.db
      - LCP_WORK_TASKS_DIR=/app/work-tree/tasks
      - LCP_WORK_TODO=/app/work-tree/todo.md
      - LCP_CRON_OPS_DIR=/app/cron-ops
      - LCP_SELF_BASE=http://127.0.0.1:8734
      # Runtime-installed modules (semantic routing, memory, LiveBench) persist
      # in a dedicated bind-mount directory so they survive container
      # recreation. The default image is LEAN: each module's deps are installed
      # from the Setup page into their own --target dir under /opt/lcp-modules
      # (router/, memory/). LiveBench additionally runs in subprocesses that
      # inject their own PYTHONPATH via livebench_pythonpath(). Set
      # WITH_ROUTER=1 / WITH_MEMORY=1 / WITH_BENCH=1 to bake a module into the
      # image instead.
      - LCP_MODULES_DIR=/opt/lcp-modules
      # M2c: where this container sees the HOST profiles (the read-only mount
      # above) and where uploaded profile pictures are written. The sources file
      # names host paths and work_sources rebases them onto LCP_PROFILES_DIR —
      # without both, the profile pages look at paths that exist only outside
      # the container. Staging-proven; needed on prod (ADMIN_ACTIONS #13).
      - LCP_PROFILES_DIR=/app/profiles
      - LCP_AVATAR_DIR=/app/data/avatars
      # Provider API keys and the OpenCode cookie are managed via the dashboard
      # UI — they're encrypted with LCP_SECRET_KEY and stored in SQLite.
