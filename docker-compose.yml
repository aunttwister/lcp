services:
  lcp:
    build: .
    container_name: lcp
    restart: unless-stopped
    ports:
      - "8734:8734"
    volumes:
      - /your/data/app/lcp/data:/app/data
      - /your/data/app/lcp/modules:/opt/lcp-modules
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken_cache
      - LCP_SECRET_KEY=${LCP_SECRET_KEY}
      # Runtime-installed modules (e.g. LiveBench) persist in a dedicated
      # bind-mount directory so they survive container recreation.
      - LCP_MODULES_DIR=/opt/lcp-modules
      # Make module dependencies importable: LiveBench deps (site) + the
      # livebench package (<repo-root>/livebench) + memory module deps
      # ($LCP_MODULES_DIR/memory).
      - PYTHONPATH=/opt/lcp-modules/site:/opt/lcp-modules/livebench:/opt/lcp-modules/memory
      # Provider API keys and the OpenCode cookie are managed via the dashboard
      # UI — they're encrypted with LCP_SECRET_KEY and stored in SQLite.
