<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LCP{% endblock %}</title>
<link rel="stylesheet" href="/static/dashboard.css?v={{ cache_buster }}">
{% block head_extra %}{% endblock %}
</head>
<body>
{% block sidebar %}
{% include "_sidebar.html" %}
{% endblock %}
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
<div class="main-content">
{% block content %}{% endblock %}
</div>

<script>
var monthly = {{ monthly_json | safe }};
var configuredProviders = {{ configured_providers_json | safe }};
</script>
{% block base_scripts %}
<script src="/static/js/api.js?v={{ cache_buster }}"></script>
<script src="/static/js/sidebar.js?v={{ cache_buster }}"></script>
<script src="/static/js/modal.js?v={{ cache_buster }}"></script>
<script src="/static/js/stack.js?v={{ cache_buster }}"></script>
{% endblock %}
{% block scripts %}{% endblock %}
{% block body_end %}{% endblock %}
</body>
</html>
