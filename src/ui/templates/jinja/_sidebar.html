<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span>LCP</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Monitor</div>
    <a href="/dashboard"{% if active_page == 'dashboard' %} class="active"{% endif %}>Dashboard</a>
    <div class="sb-usage-nav" id="usageNav">
      <a href="/usage"{% if active_page == 'usage' %} class="active"{% endif %}>Usage
        <span class="sb-usage-chev" id="usageChevron" onclick="event.preventDefault();event.stopPropagation();toggleUsageSubmenu()" title="Toggle provider details"><i aria-hidden="true"></i></span>
        <span class="sb-usage-refresh" id="sbUsageRefreshBtn" role="button" tabindex="0"
          onclick="event.preventDefault();event.stopPropagation();sbUsageRefresh(event)"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();sbUsageRefresh(event)}"
          title="Refresh cached provider data" aria-label="Refresh usage cache" aria-live="polite">
          <span class="sb-usage-refresh-icon" aria-hidden="true">↻</span>
        </span>
      </a>
      <div class="sb-usage-submenu" id="usageSubmenu"></div>
    </div>
    <a href="/logs"{% if active_page == 'logs' %} class="active"{% endif %}>Logs</a>
    <a href="/alerts"{% if active_page == 'alerts' %} class="active"{% endif %}>Alerts <span id="sidebarAlertBadge" class="sb-alert-badge" style="display:none">0</span></a>

    <div class="nav-label">Gateway</div>
    <a href="/providers"{% if active_page == 'providers' %} class="active"{% endif %}>Providers</a>
    <a href="/models"{% if active_page == 'models' %} class="active"{% endif %}>Models</a>
    <a href="/profiles"{% if active_page == 'profiles' %} class="active"{% endif %}>Profiles</a>
    <a href="/keys"{% if active_page == 'keys' %} class="active"{% endif %}>API Keys</a>

    <div class="nav-label">Admin</div>
    <a href="/setup"{% if active_page == 'setup' %} class="active"{% endif %}>Setup</a>
  </nav>
</aside>
