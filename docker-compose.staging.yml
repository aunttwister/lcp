# LCP REVIEW / STAGING INSTANCE — built from the feat/runboard-merge branch.
#
# Purpose: let the admin inspect runboard-merge changes OUTSIDE production.
# Prod (`lcp`, 8734) is untouched by this file.
#
# Deliberate differences from docker-compose.yml (ALL required to avoid
# colliding with prod):
#   service/container name  lcp        -> lcp-staging
#   host port               8734       -> 8735
#   data volume             .../lcp/data -> .../lcp-staging/data  (COPY, not shared)
#   project name            lcp        -> lcp-staging (via -p)
#
# The modules directory IS deliberately shared with prod: it holds installed
# Python deps (~12 GB) and re-installing them per instance is wasteful. Nothing
# in normal operation writes there except the Setup page's module installer.
#
# NEVER run `down`/`stop` against the prod project from this file. Bring this
# instance up with:
#   docker compose -f docker-compose.staging.yml -p lcp-staging up -d --build
services:
  lcp-staging:
    build:
      context: .
      args:
        WITH_ROUTER: ${WITH_ROUTER:-0}
        WITH_MEMORY: ${WITH_MEMORY:-0}
        WITH_BENCH: ${WITH_BENCH:-0}
    container_name: lcp-staging
    restart: unless-stopped
    ports:
      - "8735:8734"
    volumes:
      - /your/data/app/lcp-staging/data:/app/data
      - /your/data/app/lcp/modules:/opt/lcp-modules
      # Work layer reads the board's ledger. Mounted READ-ONLY on purpose: the
      # "a Work view cannot change what was published" property is enforced at
      # the container boundary, not merely by the code choosing to open SQLite
      # read-only.
      - /your/data/app/runboard/decisions.db:/app/work/decisions.db:ro
      # The task tree. READ-ONLY for the same reason as the ledger: a view of
      # pending work must not be able to move a task, and mounting read-only
      # makes that structural. The state of a task IS its directory, so a
      # writable mount would let a dashboard silently complete your work.
      - /root/.hermes/profiles/homelab-expert-l2/work:/app/work-tree:ro
    env_file:
      - .env
    environment:
      - COST_DB=/app/data/costs.db
      - LISTEN_PORT=8734
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken_cache
      - LCP_SECRET_KEY=${LCP_SECRET_KEY}
      - LCP_MODULES_DIR=/opt/lcp-modules
      - LCP_WORK_DECISIONS_DB=/app/work/decisions.db
      - LCP_WORK_TASKS_DIR=/app/work-tree/tasks
      - LCP_WORK_TODO=/app/work-tree/todo.md
      # The Fleet view reads LCP's OWN provider/profile APIs rather than a
      # second copy of the chain data, so what it shows is the chain LCP will
      # actually use. Inside the container that is loopback on the internal port.
      - LCP_SELF_BASE=http://127.0.0.1:8734
