server:
  port: 8734
  default_profile: l2
profiles:
  l2:
    forbidden_tools:
    - write_file
    - patch
    - cronjob
    chain:
    - provider: opencode
      model: deepseek-v4-pro
      base_url: https://opencode.ai/zen/go/v1
    - provider: deepseek
      model: deepseek-v4-pro
      base_url: https://api.deepseek.com/v1
    auth_required: false
  l1:
    forbidden_tools:
    - write_file
    - patch
    - terminal
    - execute_code
    - cronjob
    - process
    - delegate_task
    - memory
    - send_message
    - vision_analyze
    chain:
    - provider: opencode
      model: deepseek-v4-flash
      base_url: https://opencode.ai/zen/go/v1
    - provider: deepseek
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
    auth_required: false
  career:
    forbidden_tools:
    - write_file
    - patch
    - terminal
    - execute_code
    - cronjob
    - process
    - delegate_task
    - memory
    - vision_analyze
    - read_file
    - search_files
    - skill_manage
    - todo
    chain:
    - provider: deepseek
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
    auth_required: false
  cron:
    chain:
    - provider: deepseek
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
    forbidden_tools: null
    auth_required: false
  coder:
    chain:
    - provider: opencode
      model: deepseek-v4-pro
      base_url: https://opencode.ai/zen/go/v1
    - provider: deepseek
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
    forbidden_tools: []
    auth_required: true
providers:
  opencode:
    api_key_env: OPENCODE_API_KEY
    api_base: https://opencode.ai/zen/go/v1
    models:
    - deepseek-v4-pro
    - deepseek-v4-flash
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com/v1
    models:
    - deepseek-v4-pro
    - deepseek-v4-flash
    cache:
      strategy: prefix
      savings: cost
      hit_field: prompt_cache_hit_tokens
  commandcode:
    api_base: https://api.commandcode.ai/v1
    models:
    - deepseek-v4-pro
    - deepseek-v4-flash
    - claude-sonnet-5
    - gpt-5.6-luna
    - kimi-k3
    - minimax-m3
    - qwen3.8-max
pricing:
- provider: deepseek
  model: deepseek-v4-pro
  cache_hit: 0.003625
  cache_miss: 0.435
  output: 0.87
- provider: deepseek
  model: deepseek-v4-flash
  cache_hit: 0.0028
  cache_miss: 0.14
  output: 0.28
- provider: opencode
  model: deepseek-v4-pro
  cache_hit: 0.003625
  cache_miss: 0.435
  output: 0.87
- provider: opencode
  model: deepseek-v4-flash
  cache_hit: 0.0028
  cache_miss: 0.14
  output: 0.28
circuit_breaker:
  failures_degraded: 3
  failures_dead: 6
  degraded_cooldown_seconds: 30
  dead_cooldown_seconds: 120
retry:
  max_attempts: 3
  backoff_base: 0.5
  backoff_multiplier: 2
  max_backoff: 10
  jitter: true
model_limits:
  deepseek-v4-pro:
    context_window: 1000000
    max_output_tokens: 384000
    supports_vision: false
    supports_thinking: true
    description: DeepSeek V4 Pro — flagship MoE for coding, reasoning, and agentic
      work
  deepseek-v4-flash:
    context_window: 1000000
    max_output_tokens: 384000
    supports_vision: false
    supports_thinking: true
    description: DeepSeek V4 Flash — fast lane for economical reasoning and long-context
      work
database:
  path: /app/data/costs.db
  wal_mode: true
